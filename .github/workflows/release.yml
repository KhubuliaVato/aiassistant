# Push a tag like v1.0.1 → GitHub builds 1FlowAiAssistant.zip and publishes it as a release.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build 1FlowAiAssistant.zip
        shell: pwsh
        run: ./build.ps1
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: 1FlowAiAssistant.zip
          generate_release_notes: true
